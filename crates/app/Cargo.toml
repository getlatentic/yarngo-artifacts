[package]
name = "voicestudio"
version.workspace = true
build = "build.rs"
edition.workspace = true

[[bin]]
name = "voicestudio"
path = "src/main.rs"

[dependencies]
speech-engine = { path = "../speech-engine" }
yarngo-synthesis = { path = "../synthesis" }
yarngo-store = { path = "../store" }
chrono = "0.4"
serde.workspace = true
serde_json.workspace = true
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
rodio = "0.22.2"
cpal = "0.18.2"
hound = "3.5.1"
# Reading is not the same job as writing. hound writes the WAV the recorder
# produces; Symphonia reads whatever the user actually has, which is usually a
# voice memo — .m4a — and never a WAV. Pure Rust, so nothing is shipped
# alongside the binary and Windows behaves identically.
symphonia = { version = "0.5", features = ["aac", "alac", "isomp4", "mp3"] }
rust-i18n = "4.2"

# Two class methods and a completion block, for asking whether we may record.
# Raw rather than objc2-av-foundation, which is 168 features of bindings for a
# question with four possible answers.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

# cargo-packager produces macOS .app/.dmg, Windows NSIS/MSI and Linux
# deb/AppImage from one config. Zed hand-rolls this (a patched cargo-bundle plus
# Inno Setup) because it predates the tooling; cargo-bundle still has no Windows
# support, so it is not an option for a cross-platform target.
[package.metadata.packager]
product-name = "yarngo studio"
identifier = "dev.yarngo.studio"
description = "Speak text in your own voice, entirely on your machine."
authors = ["yarngo"]
category = "Productivity"
# Resources are copied with `{ src, target }` rather than bare globs. A bare
# glob flattens everything into Resources/, which would land both packs'
# pyproject.toml at the same path — the second silently overwriting the first —
# and fails outright on any directory the glob matches.
resources = [
  # Named rather than globbed, so a new file beside the sidecar — a test, a
  # scratch script — cannot ship by accident.
  { src = "../../sidecar/engine.py", target = "sidecar/engine.py" },
  # engine.py imports this at module level, so a bundle without it has no
  # engine at all. Named here for the same reason as the others, and missing
  # here for the whole of the protocol's life until a packaged start-up check
  # went looking for it.
  { src = "../../sidecar/protocol.py", target = "sidecar/protocol.py" },
  { src = "../../sidecar/dots_torch.py", target = "sidecar/dots_torch.py" },
  { src = "locales/app.yml", target = "locales/app.yml" },
  { src = "../../packaging/catalog.json", target = "catalog.json" },
  { src = "../../packaging/packs/mlx/*", target = "packs/mlx" },
  { src = "../../packaging/packs/torch/*", target = "packs/torch" },
  # The TUF root role, once scripts/tuf-repo.sh init has been run and its
  # root.json committed here. Until it ships, nothing is published to this
  # application and installs use the recipe above — uncomment when it exists,
  # because a named resource that is missing fails packaging on purpose.
  # { src = "../../packaging/tuf/root.json", target = "tuf/root.json" },
]
# Cut from the brand mark by scripts/make-app-icon.py. Without this the app
# ships with the generic binary icon.
icons = ["../../packaging/YarngoStudio.icns", "../../packaging/icon-1024.png"]

[package.metadata.packager.macos]
minimum-system-version = "13.0"
# Shown verbatim in the macOS permission prompt.
info-plist-path = "../../packaging/Info.plist"
# Hardened-runtime entitlements. Notarization requires the hardened runtime,
# and the hardened runtime blocks both microphone capture and the sidecar's
# unsigned native extensions unless these are declared.
entitlements = "../../packaging/yarngo-studio.entitlements"
