    sk: "%{rtf}× reálneho času tu"
  can_clone:
    en: can speak in your voice
    sk: dokáže hovoriť vaším hlasom
  uses_recorded:
    en: Uses recorded voices
    sk: Použije nahraté hlasy
  own_voices_only:
    en: Own voices only — no cloning
    sk: Len vlastné hlasy — bez klonovania
