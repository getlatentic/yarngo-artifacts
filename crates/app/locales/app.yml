  on_disk:
    en: on disk
    sk: na disku
  explain:
    en: Switching only changes the next clip. Clips already made keep the model they were made with.
    sk: Prepnutie ovplyvní až ďalšiu nahrávku. Hotové nahrávky si ponechajú model, ktorým vznikli.
  manage:
    en: Manage models…
    sk: Spravovať modely…

