  voices_detail:
    en: The reference recordings your voices were learned from.
    sk: Referenčné nahrávky, z ktorých vznikli vaše hlasy.
  runtime_elsewhere:
    en: No runtime of its own — this build is using an interpreter from elsewhere on the machine.
    sk: Nemá vlastný engine — toto zostavenie používa interpreter z iného miesta v počítači.
  where:
    en: All of it is in one folder. Deleting that folder removes everything the app has stored; your saved WAVs stay where you put them.
    sk: Všetko je v jednom priečinku. Jeho vymazaním sa odstráni všetko uložené aplikáciou; vaše uložené WAV súbory zostanú tam, kam ste ich dali.
  recount:
    en: Measure again
    sk: Zmerať znova

about:
  build:
    en: "Version %{version}"
    sk: "Verzia %{version}"
  privacy:
    en: Privacy
    sk: Súkromie
  privacy_body:
    en: Speech is generated on this machine. Your recordings, your voices and every clip stay on this disk — nothing about them is uploaded, and there is no account.
    sk: Reč vzniká v tomto počítači. Vaše nahrávky, hlasy aj nahrávky zostávajú na tomto disku — nič sa nenahráva na internet a nie je potrebný účet.
  privacy_network:
    en: "The network is used for two things only: downloading the speech runtime the first time, and downloading a model you choose."
    sk: "Sieť sa používa len na dve veci: prvé stiahnutie rečového enginu a stiahnutie modelu, ktorý si vyberiete."
  consent:
    en: Consent
    sk: Súhlas
  consent_body:
    en: A cloned voice is a likeness, so permission is recorded per voice — the wording as it stood, the build, and a fingerprint of the recording it was given about. The log is append-only; deleting a voice leaves its line.
    sk: Klonovaný hlas je podobizeň, preto sa súhlas zaznamenáva pre každý hlas — znenie, verzia aplikácie a odtlačok nahrávky, ktorej sa týkal. Záznam sa len pridáva; vymazaním hlasu jeho riadok zostáva.
  models_elsewhere:
    en: Models are downloaded by you, not shipped with the app. Each one is named and licensed where you choose it, under Models — the terms come with anything you generate using it.
    sk: Modely si sťahujete vy, nie sú súčasťou aplikácie. Každý je pomenovaný a licencovaný tam, kde si ho vyberiete, v časti Modely — podmienky sa vzťahujú na všetko, čo s ním vytvoríte.
  built_with:
    en: Built with
    sk: Postavené na
  on_this_machine:
    en: on this machine
    sk: v tomto počítači

setup:
  explain:
    en: yarngo studio downloads its speech engine the first time you open it — about 350 MB, plus a voice model. It only happens once, and everything stays on this machine.
    sk: yarngo studio si pri prvom spustení stiahne rečový engine — približne 350 MB a hlasový model. Stane sa to len raz a všetko zostáva v tomto počítači.
  runtime_ready:
    en: Installed and running
    sk: Nainštalované a beží
  next_is_a_model:
    en: "Next: choose a model. One download, then you can generate."
    sk: Ďalej si vyberte model. Jedno stiahnutie a môžete generovať.
  first_run:
    en: First run
    sk: Prvé spustenie
  header_title:
    en: Set up yarngo studio
    sk: Nastavenie yarngo studio
  header_detail:
    en: Three steps, a few minutes. No account. Speech is generated on this machine.
    sk: Tri kroky, pár minút. Bez účtu. Reč vzniká v tomto počítači.
  install:
    en: Set up yarngo studio
    sk: Nastaviť yarngo studio
  title:
    en: Set up yarngo studio
    sk: Nastavenie yarngo studio
  this_mac:
    en: This machine
    sk: Tento počítač
  step_runtime:
    en: Runtime
    sk: Engine
  step_model:
    en: Model
    sk: Model
  step_voice:
    en: Your voice
    sk: Váš hlas
  can_close:
    en: You can close the window — the download resumes.
    sk: Okno môžete zavrieť — sťahovanie bude pokračovať.
  quit:
    en: Quit
    sk: Ukončiť
  stopped:
    en: The runtime download stopped
    sk: Sťahovanie enginu sa zastavilo
  stopped_detail:
    en: The connection dropped. What was downloaded is kept, so resuming picks up where it stopped. Nothing was installed yet.
    sk: Spojenie sa prerušilo. Stiahnuté dáta zostávajú, takže pokračovanie nadviaže tam, kde skončilo. Zatiaľ sa nič nenainštalovalo.
  resume:
    en: Resume download
    sk: Pokračovať v sťahovaní
  runtime_detail:
    en: "%{size} · required. yarngo cannot generate speech without it."
    sk: "%{size} · povinné. yarngo bez toho nedokáže generovať reč."
  until_installed:
    en: Until it is installed
    sk: Kým nie je nainštalovaný
  cap_generate:
    en: Generating speech
    sk: Generovanie reči
  cap_models:
    en: Downloading models
    sk: Sťahovanie modelov
  cap_record:
    en: Recording a voice of your own
    sk: Nahrávanie vlastného hlasu
  cap_play:
    en: Playing clips you already made
    sk: Prehrávanie už vytvorených nahrávok
  no_connection:
    en: Slow or metered connection?
    sk: Pomalé alebo obmedzené pripojenie?
  no_connection_detail:
    en: "Download the interpreter elsewhere — a %{size} .tar.gz — and point yarngo at it. That is the largest single file, but not the whole %{total}: the speech packages and the installer still come from the network, so setup cannot finish without a connection."
    sk: "Stiahnite interpret inde — .tar.gz s veľkosťou %{size} — a ukážte naň yarngo. Je to najväčší jednotlivý súbor, no nie celých %{total}: rečové balíky a inštalátor sa aj tak sťahujú zo siete, takže bez pripojenia sa inštalácia nedokončí."
  install_from_file:
    en: Install from a file
    sk: Inštalovať zo súboru
  direct_link:
    en: Direct link
    sk: Priamy odkaz
  open_link:
    en: Open
    sk: Otvoriť
  copy_link:
    en: Copy
    sk: Kopírovať
  picked_up_next_time:
    en: yarngo picks up an interrupted download next time it opens.
    sk: yarngo pokračuje v prerušenom sťahovaní pri ďalšom spustení.
  where:
    en: Where things go
    sk: Kam sa veci ukladajú
  where_detail:
    en: The engine and models are written to Application Support. Deleting that folder removes everything. Your recordings stay where you saved them.
    sk: Engine a modely sa ukladajú do Application Support. Vymazaním tohto priečinka sa odstráni všetko. Vaše nahrávky zostanú tam, kam ste ich uložili.

