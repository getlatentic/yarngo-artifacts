# rust-i18n v2 format: one file, keyed by message, locales nested beneath.
# Separate per-locale files are the v1 layout and are not read by this version.
_version: 2

app:
  name:
    en: Yarngo Studio
    sk: Yarngo Studio
  tagline:
    en: Your voice, on your machine. Nothing is uploaded.
    sk: Váš hlas, vo vašom počítači. Nič sa nenahráva na internet.

model:
  label:
    en: Model
    sk: Model
  title:
    en: Choose a model
    sk: Vyberte model
  subtitle:
    en: One is enough to start. Others can be added later in Settings, and you can switch per clip.
    sk: Na začiatok stačí jeden. Ďalšie môžete pridať neskôr a prepínať pri každej nahrávke.
  recommended:
    en: Recommended
    sk: Odporúčané
  download:
    en: Download
    sk: Stiahnuť
  use:
    en: Use this
    sk: Použiť tento
  in_use:
    en: In use
    sk: Používa sa
  continue:
    en: Continue
    sk: Pokračovať
  measured:
    en: "%{rtf}× realtime here"
    sk: "%{rtf}× reálneho času tu"
  can_clone:
    en: can speak in your voice
    sk: dokáže hovoriť vaším hlasom
  own_voice_only:
    en: its own voice only
    sk: iba vlastným hlasom
  free_after:
    en: "Downloads continue in the background. %{gb} GB free."
    sk: "Sťahovanie pokračuje na pozadí. Voľných %{gb} GB."
  background:
    en: Downloads continue in the background.
    sk: Sťahovanie pokračuje na pozadí.

voice:
  label:
    en: Voice
    sk: Hlas
  add:
    en: Add a voice
    sk: Pridať hlas
  mine:
    en: My voice
    sk: Môj hlas
  sample:
    en: Sample voice
    sk: Ukážkový hlas
  sample_detail:
    en: bundled · for trying
    sk: súčasť aplikácie · na vyskúšanie
  hear_sample:
    en: Hear it in the sample voice
    sk: Vypočuť v ukážkovom hlase
  add_to_generate:
    en: Add a voice to generate in yours.
    sk: Pridajte hlas, aby ste generovali vo svojom.
  none_selected:
    en: No voice selected
    sk: Nie je vybraný hlas
  none_title:
    en: No voice yet
    sk: Zatiaľ žiadny hlas
  none_detail:
    en: Yarngo speaks in a voice you record. You read a short script, twenty seconds, and it is done.
    sk: Yarngo hovorí hlasom, ktorý nahráte. Prečítate krátky text, dvadsať sekúnd, a je to.
  add_takes:
    en: about a minute
    sk: približne minútu
  sample_only_listening:
    en: bundled · for listening, not for clips you keep
    sk: súčasť aplikácie · na počúvanie, nie na nahrávky, ktoré si necháte
  use_mine:
    en: Use my voice
    sk: Použiť môj hlas
  confirm_delete:
    en: Delete?
    sk: Vymazať?
  model_cannot_clone:
    en: This model speaks in its own voice only. Choose another model to use a voice of your own.
    sk: Tento model hovorí iba vlastným hlasom. Ak chcete použiť vlastný hlas, vyberte iný model.

switch:
  on_machine:
    en: On this machine
    sk: V tomto počítači
  not_downloaded:
    en: Not downloaded
    sk: Nestiahnuté
  in_memory:
    en: in memory
    sk: v pamäti
  loads_in:
