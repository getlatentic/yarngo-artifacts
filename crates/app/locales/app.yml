    sk: "Hluk v miestnosti je počuť, %{db} dB pod vaším hlasom. Prenesie sa do každej nahrávky. Pomôže nahrávať bližšie."
  upload:
    en: Upload a recording
    sk: Použiť existujúcu nahrávku
  upload_detail:
    en: A recording of someone reading this exact script — wav, m4a, mp3, flac or ogg. Nothing checks the words, so a file of anything else will slur every clip, and the voice must be yours or one you have permission to use.
    sk: Nahrávka s prečítaním presne tohto textu — wav, m4a, mp3, flac alebo ogg. Slová sa nekontrolujú, takže iný obsah pokazí každú nahrávku, a hlas musí byť váš alebo taký, na ktorý máte súhlas.
  imported_detail:
    en: Brought in from a file. Listen once — it should be this script, read by the person whose voice this is.
    sk: Načítané zo súboru. Vypočujte si to — mal by to byť tento text, prečítaný osobou, ktorej hlas to je.
