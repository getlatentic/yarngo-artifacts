    en: Read in the tone you want back. Flat reading gives flat speech.
    sk: Čítajte tónom, aký chcete dostať späť. Ploché čítanie dá plochú reč.
  tip_2:
    en: Read the whole script — full sentences carry rhythm.
    sk: Prečítajte celý text — celé vety nesú rytmus.
  tip_3:
    en: Somewhere quiet, close to the microphone, no headphones needed.
    sk: Na tichom mieste, blízko mikrofónu, slúchadlá nie sú potrebné.
