    sk: vlastný hlas modelu · nič netreba nahrávať
  yours:
    en: "Yours · %{count}"
    sk: "Vaše · %{count}"
  record_one:
    en: Record a voice
    sk: Nahrať hlas
  about_a_minute:
    en: ~1 min
    sk: ~1 min
  default_explains:
    en: Every model speaks in its own voice, so switching model changes this one. A voice you record is a reference instead — it needs a model that can copy one.
    sk: Každý model hovorí vlastným hlasom, takže zmena modelu zmení aj tento. Nahratý hlas je namiesto toho referencia — potrebuje model, ktorý ju vie skopírovať.
  reference_explains:
    en: "The reference is %{time} of you. It is used every time this clip generates."
    sk: "Referencia je %{time} vášho hlasu. Použije sa pri každom generovaní tejto nahrávky."
  saved_for_clip:
    en: "Voice saved and selected for this clip. %{time} reference, kept on this machine."
    sk: "Hlas uložený a vybraný pre túto nahrávku. Referencia %{time}, zostáva v tomto počítači."
  label:
    en: Voice
    sk: Hlas
  add:
    en: Add a voice
    sk: Pridať hlas
  mine:
    en: My voice
    sk: Môj hlas
  sample:
    en: Sample voice
    sk: Ukážkový hlas
  sample_detail:
    en: bundled · for trying
    sk: súčasť aplikácie · na vyskúšanie
  hear_sample:
    en: Hear it in the sample voice
    sk: Vypočuť v ukážkovom hlase
  add_to_generate:
    en: Add a voice to generate in yours.
    sk: Pridajte hlas, aby ste generovali vo svojom.
  none_selected:
    en: No voice selected
    sk: Nie je vybraný hlas
  none_title:
    en: No voice yet
    sk: Zatiaľ žiadny hlas
  none_detail:
    en: yarngo speaks in a voice you record. You read a short script, twenty seconds, and it is done.
    sk: yarngo hovorí hlasom, ktorý nahráte. Prečítate krátky text, dvadsať sekúnd, a je to.
  add_takes:
    en: about a minute
    sk: približne minútu
  sample_only_listening:
    en: bundled · for listening, not for clips you keep
    sk: súčasť aplikácie · na počúvanie, nie na nahrávky, ktoré si necháte
  use_mine:
    en: Use my voice
    sk: Použiť môj hlas
  confirm_delete:
    en: Delete?
    sk: Vymazať?
  preparing:
    en: Getting your new voice ready — you can carry on.
    sk: Pripravujem váš nový hlas — môžete pokračovať.
  model_cannot_clone:
    en: This model speaks in its own voice only. Choose another model to use a voice of your own.
    sk: Tento model hovorí iba vlastným hlasom. Ak chcete použiť vlastný hlas, vyberte iný model.

