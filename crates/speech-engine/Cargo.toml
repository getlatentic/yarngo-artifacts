[package]
name = "speech-engine"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Verifying the uv download. The digest is compiled in, so a tampered release
# fails here rather than being installed and signed for.
sha2 = "0.10"
tempfile = "3"
# Unpacking a runtime is a security boundary, so the rules are ours rather
# than whichever tar the host happens to ship.
tar = "0.4"
flate2 = "1"
# Who published a runtime, and whether it is current, is The Update Framework's
# question rather than one to answer here. Its HTTP client is left out: fetching
# stays on the curl the installer already uses.
tough = { version = "0.24.0", default-features = false }
url = "2"
tokio = { version = "1.53.1", features = ["rt", "time"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
yarngo-testing = { path = "../testing" }
tokio = { version = "1.53.1", features = ["rt", "time", "macros"] }

