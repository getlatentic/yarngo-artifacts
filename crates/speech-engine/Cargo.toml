[package]
name = "speech-engine"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Verifying the uv download. The digest is compiled in, so a tampered release
# fails here rather than being installed and signed for.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "runtime_install"
path = "examples/runtime_install.rs"
