# The Apple silicon speech pack.
#
# This is a manifest, not a project: nothing here is imported. It exists so the
# runtime is installed from a lock rather than resolved fresh on each machine —
# `pip install --upgrade` gave two people installing a week apart two different
# dependency trees, which is a poor foundation for an app whose promise is that
# it runs the same way on your own machine.
[project]
name = "yarngo-speech-mlx"
version = "0"
# mlx-speech declares >=3.13. The torch pack declares <3.13. They cannot share
# an interpreter, which is why each pack carries its own.
requires-python = ">=3.13"
dependencies = ["mlx-speech"]
