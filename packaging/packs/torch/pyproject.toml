# The Windows and Linux speech pack. Unproven — nothing selects it yet.
#
# It carries the same checkpoints as the MLX pack, which is the point: the
# product promises dots.tts MF and SOAR on every platform.
[project]
name = "yarngo-speech-torch"
version = "0"
# Upstream dots.tts declares >=3.10,<3.13.
requires-python = ">=3.12,<3.13"
dependencies = ["dots.tts", "torch", "torchaudio"]

[tool.uv]
# dots.tts lists WeTextProcessing as a hard dependency, which pulls pynini —
# manylinux wheels only, and its own guidance sends Windows users to conda. It
# buys text normalisation, which the upstream runtime defaults to off
# (`normalize_text: bool = False`).
#
# Scoped to dots-tts rather than excluded globally, so this says what is meant:
# yarngo packages dots.tts without its normaliser. If anything else ever needs
# WeTextProcessing, it still gets it.
#
# Dropping the package is not sufficient on its own — dots_tts/utils/text.py
# imports tn.* at module scope, so those imports have to be made lazy too.
exclude-dependencies = [
  { package = { name = "dots-tts" }, dependencies = ["WeTextProcessing"] },
]
